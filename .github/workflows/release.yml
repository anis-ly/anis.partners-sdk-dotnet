name: release

# Publishing a GitHub release tagged vX.Y.Z (or vX.Y.Z-preview.N) builds, tests and pushes that version to
# nuget.org. Nothing else publishes: a push to main never does.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # NuGet Trusted Publishing: GitHub proves this workflow's identity, NuGet returns a short-lived key.

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "The release tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-suffix]." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build Anis.Partners.Sdk.slnx -c Release -p:Version=$VERSION

      - name: Test on net8.0 and net10.0
        run: dotnet test Anis.Partners.Sdk.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/Anis.Partners.Sdk/Anis.Partners.Sdk.csproj -c Release --no-build -p:Version=$VERSION -o artifacts

      - name: Log in to NuGet
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # The .snupkg beside each .nupkg is pushed with it. A version nuget.org already holds is skipped, never replaced.
      - name: Push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/
